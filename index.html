<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WT Store | متجر الإلكترونيات</title>
<link rel="icon" href="assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo" onclick="navigate('home')"><img src="assets/logo.jpg" alt="WT Store"> <span>WT Store</span></div>
    <ul class="nav-links">
      <li><a onclick="navigate('home')">الرئيسية</a></li>
      <li><a onclick="navigate('tracking')">تتبع الطلب</a></li>
    </ul>
    <div class="header-actions">
      <a class="cart-btn" onclick="navigate('cart')">🛒<span class="cart-count" id="cartCount">0</span></a>
      <button class="btn btn-primary" onclick="navigate('home')">تسوق الآن</button>
      <div class="hamburger" id="hamburger" onclick="toggleMobileMenu()"><span></span><span></span><span></span></div>
    </div>
  </div>
</header>

<main>
  <div class="view active" id="view-home">
    <section class="hero"><div class="hero-content"><h1>تقنية تواكب <span class="accent">أسلوب حياتك</span></h1></div></section>
    <section class="section" id="productsSection"><div class="container"><div class="products-grid" id="productsGrid"></div></div></section>
  </div>
  <div class="view" id="view-product"></div>
  <div class="view" id="view-cart"></div>
  <div class="view" id="view-checkout"></div>
  <div class="view" id="view-success"></div>
  <div class="view" id="view-tracking">
    <div class="container tracking-view">
      <h1 class="page-title">تتبع طلبك</h1>
      <form class="tracking-form" onsubmit="submitTracking(event)">
        <input type="text" id="trackOrderNumber" placeholder="رقم الطلب">
        <input type="tel" id="trackPhone" placeholder="رقم الهاتف">
        <button type="submit" class="btn btn-primary">تتبع</button>
      </form>
      <div id="trackingResult"></div>
    </div>
  </div>
  <!-- صفحة الإدارة المخفية -->
  <div class="view" id="view-admin"></div>
</main>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
